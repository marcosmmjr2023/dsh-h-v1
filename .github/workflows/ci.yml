# CI — guard de segredos + lint + testes funcionais + sintaxe PowerShell
# Roda em push/PR para a branch main.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check (bash -n)
        run: |
          set -e
          for f in tools/*.sh; do bash -n "$f" && echo "OK $f"; done

      - name: ShellCheck (lint)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning tools/*.sh   # info (ex.: SC2015/SC2317 do test.sh) não falha

      - name: Guard de segredos — todos os arquivos versionados
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            case "$f" in
              # arquivos de REGRAS que citam nomes de credenciais por propósito
              .gitignore|tools/sync-excludes.txt) continue ;;
              # lê o .credentials.yaml LOCAL para regenerar dados (referência a
              # caminho, não segredo); a entrada do arquivo em si é bloqueada
              # pelo check de nome no guard --staged e pelo .gitignore
              overlay/regenerate-openrouter-data.py) continue ;;
              # fixtures INTENCIONAIS dos testes (chaves falsas sk-... e o
              # caminho .credentials.yaml) — validadas por tools/test.sh
              tools/test.sh) continue ;;
            esac
            tools/guard-secrets.sh "$f" >/dev/null 2>&1 || {
              echo "::error::possível segredo em $f — rode tools/guard-secrets.sh $f"
              fail=1
            }
          done < <(git ls-files)
          [ "$fail" -eq 0 ] && echo "✔ guard limpo nos arquivos versionados"

      - name: Valida manifest.json
        run: python3 -m json.tool manifest.json >/dev/null && echo "✔ manifest.json válido"

      - name: Nenhum dado do usuário versionado
        run: |
          set -e
          # Anexos de sessão, sessões, storages, perfil do app e credenciais nunca
          # podem entrar num repositório público. Foi assim que anexos com hostname
          # de VPS e caminhos pessoais apareceram aqui (espelho automático da config
          # viva). Falha o CI se voltarem a ser versionados.
          padrao='^(overlay/)?(attachments|sessions|storages|app-profile)/|\.credentials\.yaml|\.encryption-key$|\.anonymous-user-id$|\.dsh-version\.json$'
          if git ls-files | grep -E "$padrao"; then
            echo "::error::dado do usuário versionado no repositório público — veja tools/sync-excludes.txt e o .gitignore"
            exit 1
          fi
          echo "✔ nenhum dado do usuário versionado"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testes funcionais (guard, excludes, template cordis, sync, snapshot, rollback)
        run: |
          ./tools/test.sh

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Conteúdo do pacote npm (bundle instalável)
        run: |
          set -e
          # Falha se faltar arquivo que o bundle precisa ou se entrar no pacote
          # algo da config viva (anexos, settings.yaml, profiles, credenciais).
          node tools/check-npm-package.mjs

  windows-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instala PowerShell
        run: |
          curl -sSL -o /tmp/pwsh.deb \
            https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell_7.4.6-1.deb_amd64.deb
          sudo dpkg -i /tmp/pwsh.deb || sudo apt-get install -y -f -qq >/dev/null
          pwsh --version
      - name: Parse de sintaxe dos scripts PowerShell
        run: |
          pwsh -NoProfile -Command '
            $errs = New-Object System.Collections.Generic.List[object]
            foreach ($pat in @("tools/*.ps1", "installer/*.ps1")) {
              Get-ChildItem -Path $pat | ForEach-Object {
                $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
              }
            }
            if ($errs.Count -gt 0) {
              $errs | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "✔ Sintaxe PowerShell OK"
          '
